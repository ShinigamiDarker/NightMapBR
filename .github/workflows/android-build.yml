name: Build NightMap BR

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          mkdir -p /tmp/nightmap-source
          unzip -q NightMapBR-Android-Starter.zip -d /tmp/nightmap-source
          PROJECT_DIR="$(dirname "$(find /tmp/nightmap-source -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Android não encontrado no ZIP."
            exit 1
          fi
          cp -R "$PROJECT_DIR"/. .

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NightMapBR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
